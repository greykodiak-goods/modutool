# Convex 배포 — 개발 컨테이너는 네트워크 정책이 convex.dev를 차단하므로 러너(개방망)에서 배포한다.
# 사전조건: 레포 Settings → Secrets and variables → Actions → CONVEX_DEPLOY_KEY 등록.
name: Convex deploy
on:
  workflow_dispatch:
    inputs:
      seed_admin_email:
        description: "adminUsers에 시드할 관리자 이메일 (비우면 시드 생략)"
        required: false
        default: "greykodiak1@gmail.com"
      site_url:
        description: "OAuth 리다이렉트 허용 기준 URL (끝 슬래시 없이)"
        required: false
        default: "https://greykodiak-goods.github.io/modutool"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install --no-audit --no-fund
      # 시크릿 원본 = Doppler(awning-ops와 동일 패턴). 실패 시 GitHub Secret/Variable로 자동 폴백(무중단).
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
        continue-on-error: true

      - name: Resolve CONVEX_DEPLOY_KEY (Doppler → GitHub 폴백)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          KEY_FALLBACK: ${{ secrets.CONVEX_DEPLOY_KEY != '' && secrets.CONVEX_DEPLOY_KEY || vars.CONVEX_DEPLOY_KEY }}
        run: |
          KEY=""
          if [ -n "$DOPPLER_TOKEN" ] && command -v doppler >/dev/null 2>&1; then
            KEY=$(doppler secrets get CONVEX_DEPLOY_KEY --plain 2>/dev/null || true)
            [ -n "$KEY" ] && echo "✅ 시크릿 출처: Doppler"
          fi
          if [ -z "$KEY" ]; then
            KEY="$KEY_FALLBACK"
            [ -n "$KEY" ] && echo "⚠️ 시크릿 출처: GitHub Secret(폴백) — Doppler 조회 실패/미설정"
          fi
          if [ -z "$KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY를 Doppler·GitHub 어디서도 가져오지 못했습니다. (Doppler에 CONVEX_DEPLOY_KEY 등록 + 이 레포에 DOPPLER_TOKEN 시크릿 등록을 권장)"
            exit 1
          fi
          # 후속 스텝에 안전하게 전달(로그 마스킹 + env 파일)
          echo "::add-mask::$KEY"
          echo "CONVEX_DEPLOY_KEY=$KEY" >> "$GITHUB_ENV"
          echo "key resolved (${#KEY} chars)"
      # ── Convex Auth 서명키 (최초 1회 자동 생성) ──
      # @convex-dev/auth는 세션 JWT를 RS256으로 서명한다. 개인키(JWT_PRIVATE_KEY)와 공개 JWKS를
      # 배포 환경변수에 넣어야 하는데, 개발 컨테이너는 convex.dev가 막혀 있어 여기서 만든다.
      # ⚠️ 이미 값이 있으면 절대 덮어쓰지 않는다 — 키를 갈아끼우면 발급된 세션이 전부 무효가 된다.
      # 키는 로그에 찍지 않는다(길이만 출력).
      - name: Ensure Convex Auth signing keys
        run: |
          # ⚠️ `convex env get`은 값이 없어도 종료코드 0이라 if로 존재 여부를 판단하면 안 된다
          #    (2026-07-26 실사고: 키가 없는데 "이미 설정됨"으로 건너뛰어 jwks.json이 500).
          #    출력 유무로 판단하되, 값이 변수·로그에 남지 않도록 바이트 수만 센다.
          has() { [ "$(npx convex env get "$1" 2>/dev/null | head -c 1 | wc -c)" -gt 0 ]; }
          if has JWT_PRIVATE_KEY && has JWKS; then
            echo "서명키 이미 설정됨 — 건너뜀(재생성 시 기존 세션 전부 무효화)"
          else
            echo "서명키 생성 중… (개인키·JWKS 중 하나라도 없으면 쌍으로 다시 만든다)"
            # jose는 ESM 전용이라 --input-type=module 로 실행한다.
            # 개인키는 표준출력이 아니라 파일로만 흘려보낸다(로그 노출 방지).
            node --input-type=module -e '
              import { generateKeyPair, exportPKCS8, exportJWK } from "jose";
              import { writeFileSync } from "node:fs";
              const keys = await generateKeyPair("RS256", { extractable: true });
              const pkcs8 = await exportPKCS8(keys.privateKey);
              const pub = await exportJWK(keys.publicKey);
              // Convex 환경변수는 개행을 담기 어려워 공백으로 치환한다(@convex-dev/auth 관례).
              writeFileSync("/tmp/jwt_private_key", pkcs8.trimEnd().replace(/\n/g, " "));
              writeFileSync("/tmp/jwks", JSON.stringify({ keys: [{ use: "sig", ...pub }] }));
            '
            npx convex env set JWT_PRIVATE_KEY -- "$(cat /tmp/jwt_private_key)"
            npx convex env set JWKS -- "$(cat /tmp/jwks)"
            rm -f /tmp/jwt_private_key /tmp/jwks
            echo "서명키 설정 완료"
          fi
          # OAuth 리다이렉트 허용 기준. 이 값으로 시작하는 redirectTo만 통과한다.
          npx convex env set SITE_URL -- "${SITE_URL_INPUT:-https://greykodiak-goods.github.io/modutool}"
        env:
          SITE_URL_INPUT: ${{ inputs.site_url }}

      # 구글 OAuth 자격증명 — 인증 코드는 Convex 위에서 돌므로 러너 env가 아니라
      # "Convex 배포 환경변수"에 있어야 한다. @auth/core가 읽는 이름이 정해져 있다:
      #   AUTH_<PROVIDER>_ID / AUTH_<PROVIDER>_SECRET  → 구글은 AUTH_GOOGLE_ID / AUTH_GOOGLE_SECRET
      # Doppler에는 그 이름 그대로 넣어두면 여기서 배포로 밀어넣는다.
      # 미등록이면 조용히 건너뛴다 — 구글 버튼만 비활성이고 이메일 로그인은 정상 동작한다.
      - name: Push Google OAuth creds to Convex (있을 때만)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GID_FALLBACK: ${{ secrets.AUTH_GOOGLE_ID }}
          GSECRET_FALLBACK: ${{ secrets.AUTH_GOOGLE_SECRET }}
        run: |
          fetch_key() {  # Doppler 우선 → GitHub Secret 폴백
            local v=""
            if [ -n "$DOPPLER_TOKEN" ] && command -v doppler >/dev/null 2>&1; then
              v=$(doppler secrets get "$1" --plain 2>/dev/null || true)
            fi
            [ -z "$v" ] && v="$2"
            printf '%s' "$v"
          }
          GID=$(fetch_key AUTH_GOOGLE_ID "$GID_FALLBACK")
          GSECRET=$(fetch_key AUTH_GOOGLE_SECRET "$GSECRET_FALLBACK")
          if [ -n "$GID" ] && [ -n "$GSECRET" ]; then
            echo "::add-mask::$GSECRET"
            npx convex env set AUTH_GOOGLE_ID -- "$GID"
            npx convex env set AUTH_GOOGLE_SECRET -- "$GSECRET"
            echo "구글 OAuth 자격증명 반영 완료"
          else
            echo "AUTH_GOOGLE_ID/SECRET 미등록 — 구글 로그인 비활성(이메일 로그인은 정상)"
          fi

      - name: Deploy schema + functions
        run: npx convex deploy --yes
      - name: Seed admin email
        if: inputs.seed_admin_email != ''
        run: npx convex run admin:seedAdmin '{"email":"${{ inputs.seed_admin_email }}"}'
      - name: E2E — /log-event HTTP action
        run: |
          # deploy key 형식 dev:<name>|... 에서 deployment 이름 추출 → .convex.site URL
          NAME=$(echo "$CONVEX_DEPLOY_KEY" | sed -E 's/^[a-z]+:([^|]+)\|.*/\1/')
          SITE="https://$NAME.convex.site"
          echo "endpoint: $SITE/log-event"
          fail=0
          echo "--- valid insert (expect 201) ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SITE/log-event" \
            -H "Content-Type: application/json" -H "Origin: https://greykodiak-goods.github.io" \
            --data '{"tool":"convex-ci","outcome":"error","reason":"ci_e2e","lang":"en","site":"pdf","ua":"ci/runner","meta":{"seed":true}}')
          echo "insert: $code"; [ "$code" = "201" ] || fail=1
          echo "--- bad json (expect 400) ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SITE/log-event" \
            -H "Content-Type: application/json" --data 'not-json')
          echo "bad json: $code"; [ "$code" = "400" ] || fail=1
          echo "--- CORS preflight (expect 204 + allow-origin) ---"
          hdr=$(curl -s -D - -o /dev/null -X OPTIONS "$SITE/log-event" \
            -H "Origin: https://greykodiak-goods.github.io" -H "Access-Control-Request-Method: POST")
          echo "$hdr" | head -8
          echo "$hdr" | grep -qi "access-control-allow-origin" || fail=1
          echo "--- Convex Auth 라우트 존재 (404가 아니어야 함) ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/.well-known/openid-configuration")
          echo "openid-configuration: $code"; [ "$code" = "200" ] || fail=1
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/.well-known/jwks.json")
          echo "jwks.json: $code"; [ "$code" = "200" ] || fail=1
          exit $fail

      # 실제 로그인이 되는지 라이브 배포에 대고 확인한다(모의가 아니라 진짜 계정 생성 → 삭제).
      # 컨테이너에서 convex.dev로 못 나가므로 이 검증은 러너에서만 가능하다.
      - name: E2E — 회원가입/로그인/삭제 왕복
        if: always()
        run: |
          NAME=$(echo "$CONVEX_DEPLOY_KEY" | sed -E 's/^[a-z]+:([^|]+)\|.*/\1/')
          API="https://$NAME.convex.cloud"
          EMAIL="ci-${{ github.run_id }}@e2e.invalid"
          PASS="CiTest12345"
          fail=0
          call() {  # call <endpoint> <json-body> [bearer]
            if [ -n "$3" ]; then
              curl -s -X POST "$API/api/$1" -H "Content-Type: application/json" -H "Authorization: Bearer $3" --max-time 20 --data "$2"
            else
              curl -s -X POST "$API/api/$1" -H "Content-Type: application/json" --max-time 20 --data "$2"
            fi
          }

          echo "--- 1) 회원가입 (expect tokens) ---"
          R=$(call action "{\"path\":\"auth:signIn\",\"format\":\"convex_encoded_json\",\"args\":[{\"provider\":\"password\",\"params\":{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"flow\":\"signUp\"}}]}")
          TOKEN=$(echo "$R" | jq -r '.value.tokens.token // empty')
          echo "status=$(echo "$R" | jq -r .status) token=$([ -n "$TOKEN" ] && echo yes || echo no)"
          [ -n "$TOKEN" ] || { echo "::error::회원가입 실패: $(echo "$R" | head -c 200)"; exit 1; }
          echo "::add-mask::$TOKEN"

          echo "--- 2) 짧은 비밀번호는 서버가 거절 (expect error) ---"
          R=$(call action "{\"path\":\"auth:signIn\",\"format\":\"convex_encoded_json\",\"args\":[{\"provider\":\"password\",\"params\":{\"email\":\"weak-$EMAIL\",\"password\":\"abc\",\"flow\":\"signUp\"}}]}")
          [ "$(echo "$R" | jq -r .status)" = "error" ] && echo "약한 비밀번호 거절 OK" || { echo "::error::약한 비밀번호가 통과함"; fail=1; }

          echo "--- 3) 본인 정보 조회 (인증 필요) ---"
          R=$(call query "{\"path\":\"account:me\",\"format\":\"convex_encoded_json\",\"args\":[{}]}" "$TOKEN")
          GOT=$(echo "$R" | jq -r '.value.email // empty')
          [ "$GOT" = "$EMAIL" ] && echo "account:me OK ($GOT)" || { echo "::error::account:me 불일치: $(echo "$R" | head -c 200)"; fail=1; }
          [ "$(echo "$R" | jq -r '.value.plan')" = "free" ] && echo "기본 플랜 free OK" || { echo "::error::기본 플랜이 free가 아님"; fail=1; }

          echo "--- 4) 토큰 없이 같은 쿼리 → null (남의 데이터 안 보임) ---"
          R=$(call query "{\"path\":\"account:me\",\"format\":\"convex_encoded_json\",\"args\":[{}]}")
          [ "$(echo "$R" | jq -r '.value')" = "null" ] && echo "미인증 조회 null OK" || { echo "::error::미인증인데 값이 나옴: $(echo "$R" | head -c 200)"; fail=1; }

          echo "--- 5) 틀린 비밀번호로 로그인 (expect error) ---"
          R=$(call action "{\"path\":\"auth:signIn\",\"format\":\"convex_encoded_json\",\"args\":[{\"provider\":\"password\",\"params\":{\"email\":\"$EMAIL\",\"password\":\"WrongPass9999\",\"flow\":\"signIn\"}}]}")
          [ "$(echo "$R" | jq -r .status)" = "error" ] && echo "오답 거절 OK" || { echo "::error::틀린 비밀번호가 통과함!"; fail=1; }

          echo "--- 6) 올바른 비밀번호로 재로그인 (expect tokens) ---"
          R=$(call action "{\"path\":\"auth:signIn\",\"format\":\"convex_encoded_json\",\"args\":[{\"provider\":\"password\",\"params\":{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"flow\":\"signIn\"}}]}")
          T2=$(echo "$R" | jq -r '.value.tokens.token // empty')
          RT2=$(echo "$R" | jq -r '.value.tokens.refreshToken // empty')
          [ -n "$T2" ] && echo "재로그인 OK" || { echo "::error::재로그인 실패: $(echo "$R" | head -c 200)"; fail=1; }
          [ -n "$T2" ] && echo "::add-mask::$T2"
          [ -n "$RT2" ] && echo "::add-mask::$RT2"

          echo "--- 7) 리프레시 토큰 교환 (세션 유지 경로) ---"
          if [ -n "$RT2" ]; then
            R=$(call action "{\"path\":\"auth:signIn\",\"format\":\"convex_encoded_json\",\"args\":[{\"refreshToken\":\"$RT2\"}]}")
            T3=$(echo "$R" | jq -r '.value.tokens.token // empty')
            [ -n "$T3" ] && { echo "토큰 갱신 OK"; echo "::add-mask::$T3"; TOKEN="$T3"; } || { echo "::error::토큰 갱신 실패: $(echo "$R" | head -c 200)"; fail=1; }
          fi

          echo "--- 8) 이메일 불일치 삭제는 거부 ---"
          R=$(call mutation "{\"path\":\"account:deleteAccount\",\"format\":\"convex_encoded_json\",\"args\":[{\"confirmEmail\":\"other@e2e.invalid\"}]}" "$TOKEN")
          [ "$(echo "$R" | jq -r .status)" = "error" ] && echo "불일치 삭제 거부 OK" || { echo "::error::이메일이 달라도 삭제됨!"; fail=1; }

          echo "--- 9) 정리: 테스트 계정 영구 삭제 ---"
          R=$(call mutation "{\"path\":\"account:deleteAccount\",\"format\":\"convex_encoded_json\",\"args\":[{\"confirmEmail\":\"$EMAIL\"}]}" "$TOKEN")
          [ "$(echo "$R" | jq -r '.value.ok')" = "true" ] && echo "테스트 계정 삭제 OK" || { echo "::error::테스트 계정이 남았습니다($EMAIL) — 수동 정리 필요: $(echo "$R" | head -c 200)"; fail=1; }

          echo "--- 10) 삭제 후 같은 비밀번호로 로그인 불가 ---"
          R=$(call action "{\"path\":\"auth:signIn\",\"format\":\"convex_encoded_json\",\"args\":[{\"provider\":\"password\",\"params\":{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"flow\":\"signIn\"}}]}")
          [ "$(echo "$R" | jq -r .status)" = "error" ] && echo "삭제된 계정 로그인 차단 OK" || { echo "::error::삭제됐는데 로그인됨!"; fail=1; }

          exit $fail
