# CI — push/PR마다 전 게이트 자동 실행: 단위 → 타입 → 보안감사 → 커버리지 래칫 → 빌드 → 브라우저 검증 전 스위트.
# 기존엔 테스트가 수동 실행이라 "테스트가 있다"와 "지금 통과한다"가 달랐다(2026-08-21 감사) — 이 워크플로가 그 간극을 없앤다.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit
      - name: Typecheck (convex)
        run: npm run typecheck
      - name: Functional-test coverage ratchet
        run: npm run test:coverage
      - name: Product-contract ratchet
        run: npm run test:contract
      - name: i18n coverage ratchet (charter locales)
        run: npm run test:i18n
      - name: Security audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high

      # ── 단일 사이트 빌드 기준 검증 (구조 계약 + 루트 레이아웃 전제 테스트) ──
      - name: Single-site build
        run: node scripts/build.mjs http://127.0.0.1:8931
      - name: Structural contract + single-layout suites
        run: |
          python3 -m http.server 8931 -d dist > /dev/null 2>&1 &
          SRV=$!
          sleep 1
          node tests/structural.mjs http://127.0.0.1:8931
          node tests/smoke-pdf-merge.mjs http://127.0.0.1:8931
          for t in admin-smoke pages-smoke cv-tools-func redact-func; do
            echo "── tests/$t.mjs"; node tests/$t.mjs
          done
          kill $SRV

      # ── 폐쇄망(자체호스팅) 번들 — 외부 요청 0건 계약 ──
      - name: Offline bundle contract
        run: |
          OFFLINE=1 SITE=pdf node scripts/build.mjs https://tools.internal /tmp/offline-pdf
          node tests/offline-bundle.mjs /tmp/offline-pdf

      # ── 우산(운영과 동일 구조) 빌드 기준 기능 검증 — 실제 산출물(PDF/이미지/계산값) 파싱 ──
      - name: Umbrella build (production layout)
        run: BASE_PATH=/modutool node scripts/build-all.mjs https://greykodiak-goods.github.io/modutool
      - name: Functional suites (real output verification)
        run: |
          for t in umbrella-smoke subsites-smoke telemetry.spec convex-switch auth-func contact-func \
                   pdf-func image-func calc-func audio-tools-func video-trim-func video2-func pwa-offline; do
            echo "── tests/$t.mjs"; node tests/$t.mjs
          done
