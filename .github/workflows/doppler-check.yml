name: Doppler Check (연동 검증)

# awning-ops와 동일 패턴: Doppler에서 시크릿을 실제로 가져올 수 있는지 검증한다.
# ⚠️ 값은 절대 출력하지 않는다 — "키 이름과 존재 여부(SET/MISSING)"만 표시.
# 필요: GitHub Secret DOPPLER_TOKEN (read-only 서비스 토큰)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch & verify (값 미출력)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::DOPPLER_TOKEN 미설정 — 이 레포(modutool) Settings → Secrets and variables → Actions 에 등록 필요"
            exit 1
          fi

          # 0) 이 토큰이 "어느 프로젝트/config"를 가리키는지 먼저 밝힌다.
          #    서비스 토큰은 프로젝트·config에 묶여 발급되므로 매칭은 전적으로 이 토큰이 한다
          #    (--project/--config 플래그도, doppler.yaml도 쓰지 않는다).
          #    레포에 다른 앱 토큰을 잘못 넣으면 "키가 없다"로만 보여서 원인을 못 찾는데,
          #    이 줄이 있으면 한눈에 드러난다. DOPPLER_PROJECT/CONFIG는 Doppler가 넣어주는
          #    비밀 아닌 메타값이라 출력해도 안전하다.
          echo "===== 이 토큰이 가리키는 곳 ====="
          PRJ=$(doppler secrets get DOPPLER_PROJECT --plain 2>/dev/null || echo "(확인불가)")
          CFG=$(doppler secrets get DOPPLER_CONFIG --plain 2>/dev/null || echo "(확인불가)")
          echo "project=$PRJ  config=$CFG"
          if [ "$PRJ" != "thisismy" ] && [ "$PRJ" != "(확인불가)" ]; then
            echo "::warning::이 레포(modutool)는 Doppler 프로젝트 'thisismy'를 기대합니다. 현재 토큰은 '$PRJ' 를 가리킵니다 — 레포에 다른 앱의 토큰이 들어갔는지 확인하세요."
          fi
          echo "===== 끝 ====="

          # 1) Doppler에 실제로 들어있는 키 이름을 그대로 출력(값 없이)
          doppler secrets --only-names --json > /tmp/names.json 2>/tmp/err.txt || {
            echo "::error::Doppler 조회 실패"; cat /tmp/err.txt; exit 1;
          }
          echo "===== DOPPLER 실제 키 이름 (정렬) ====="
          node -e 'const j=require("/tmp/names.json"); Object.keys(j).sort().forEach(k=>console.log(k))'
          echo "===== 끝 ====="

          # 2) modutool이 요구하는 키와 대조
          KEYS=$(node -e 'const j=require("/tmp/names.json"); console.log(Object.keys(j).join(" "))')
          REQUIRED="CONVEX_DEPLOY_KEY"
          # 광고 유닛은 브랜드(pdf/img/calc/video)마다 따로 발급되므로 접미사로 나눈다.
          # SITE 빌드 변수와 이름이 맞아 떨어져 ADFIT_UNIT_TOP_${SITE^^} 한 줄로 뽑힌다.
          # 상세: docs/2026-07-26-namespace-plan.md 4절
          # 구글 OAuth는 @auth/core가 읽는 이름을 그대로 쓴다(AUTH_<PROVIDER>_ID/_SECRET).
          # 예전 GOOGLE_OAUTH_CLIENT_ID 이름으로 넣으면 아무도 읽지 않는다 — 2026-07-26 이관 시 교정.
          OPTIONAL="AUTH_GOOGLE_ID AUTH_GOOGLE_SECRET ADSENSE_CLIENT_ID"
          for s in PDF IMG CALC VIDEO; do OPTIONAL="$OPTIONAL ADFIT_UNIT_TOP_$s ADFIT_UNIT_BOTTOM_$s"; done
          echo "===== 필수 키 대조 ====="
          MISSING=""
          for k in $REQUIRED; do
            if echo " $KEYS " | grep -q " $k "; then echo "OK      $k"; else echo "MISSING $k"; MISSING="$MISSING $k"; fi
          done
          echo "===== 선택 키(향후) ====="
          for k in $OPTIONAL; do
            if echo " $KEYS " | grep -q " $k "; then echo "OK      $k"; else echo "-       $k (미등록)"; fi
          done
          echo "===== 끝 ====="

          # 3) 실제 주입 확인(값 미출력, 길이만)
          echo "===== 주입 테스트 ====="
          doppler run -- node -e '
            for (const k of ["CONVEX_DEPLOY_KEY"]) {
              const v = process.env[k];
              console.log((v && v.length ? "INJECTED len=" + v.length : "EMPTY") + "  " + k);
            }
          ' || echo "doppler run 실패"
          echo "===== 끝 ====="

          if [ -n "$MISSING" ]; then echo "::error::누락:$MISSING"; exit 1; fi
