# pdf-rotate — 도구 계약 (실구현·테스트 역기입, 2026-08-22 소급)
id: pdf-rotate
purpose: 쪽 단위 또는 전체를 90도 단위로 회전해 저장한다.
routes: [/pdf-rotate/, /ko/pdf-rotate/]
engine: pdf.js(썸네일) + pdf-lib(저장)

states:
  idle: 드롭존(#dz)만 표시. 실행 버튼 비활성.
  input_loading: 파일 파싱·미리보기 렌더 중(비동기).
  ready: 유효 PDF 로드 → 실행 버튼 활성.
  processing: 진행바(#prog) 진행, 재클릭 방지.
  success: 결과 파일 자동 다운로드 + ✅ 결과 문구(#result).
  error: ❌ 안전한 오류 문구(mdtlResult) → 전역 자동 캡처가 error 이벤트 전송.

components:
  dropzone: "#dz"
  page_grid: "#pgGrid (쪽별 회전)"
  all_rotate: { left: "#allLeftBtn", right: "#allRightBtn" }
  reset: "#resetBtn"
  save: "#saveBtn"

errors:
  encrypted_or_corrupted: 로드 실패 시 안전한 오류 문구.

telemetry:
  success: { tool: pdf-rotate, outcome: success }

invariants:
  - 쪽수 보존, 회전각은 지정값 그대로(전체 우회전 → 전 쪽 90도 — 테스트 검증)
  - 외부 요청 0 — 파일은 브라우저를 떠나지 않는다
  - 텔레메트리에 파일명·내용 절대 미포함 (telemetry.spec.mjs)

tests:
  - tests/pdf-func.mjs  # 전체 우회전→전 쪽 90도·쪽수 보존
