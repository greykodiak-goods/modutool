# pdf-split — 도구 계약 (실구현·테스트 역기입, 2026-08-22 소급)
id: pdf-split
purpose: 여러 쪽 PDF에서 원하는 범위를 한 파일로 추출하거나, 전 쪽을 개별 PDF로 분할한다.
routes: [/pdf-split/, /ko/pdf-split/]
engine: pdf-lib

states:
  idle: 드롭존(#dz)만 표시. 실행 버튼 비활성.
  input_loading: 파일 파싱·미리보기 렌더 중(비동기).
  ready: 유효 PDF 로드 → 실행 버튼 활성.
  processing: 진행바(#prog) 진행, 재클릭 방지.
  success: 결과 파일 자동 다운로드 + ✅ 결과 문구(#result).
  error: ❌ 안전한 오류 문구(mdtlResult) → 전역 자동 캡처가 error 이벤트 전송.

components:
  dropzone: "#dz"
  mode: { id: "#modeOpts", options: [range(범위→한 파일, 기본), all(쪽마다 개별 PDF — 0.4초 간격 순차 다운로드)] }
  range_input: { id: "#rangeInput", format: "1-3,5,7-9" }
  go: { id: "#goBtn", label_동적: "Extract selected pages | Split all (N files)" }

errors:
  invalid_range: 범위 파싱 실패·쪽수 초과 시 안전한 오류 문구, 재입력 가능.
  multi_download_blocked: split-all은 브라우저 연속 다운로드 차단 안내(splitNote·FAQ) 제공.

telemetry:
  success: { tool: pdf-split, outcome: success }

invariants:
  - 범위 추출 결과 쪽수 = 요청 범위 쪽수, 파일명 원본_범위.pdf (예 four_2-3.pdf)
  - split-all 파일명 원본_pN.pdf, 파일 수 = 쪽수
  - 외부 요청 0 — 파일은 브라우저를 떠나지 않는다
  - 텔레메트리에 파일명·내용 절대 미포함 (telemetry.spec.mjs)

tests:
  - tests/pdf-func.mjs  # 4쪽→2-3 추출 2쪽·파일명 검증
