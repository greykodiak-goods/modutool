# pdf-sign — 도구 계약 (실구현·테스트 역기입, 2026-08-22 소급)
id: pdf-sign
purpose: 서명을 그리거나 배치해 원하는 쪽에 삽입한다.
routes: [/pdf-sign/, /ko/pdf-sign/]
engine: pdf.js(미리보기) + pdf-lib(삽입) + 캔버스 패드

states:
  idle: 드롭존(#dz)만 표시. 실행 버튼 비활성.
  input_loading: 파일 파싱·미리보기 렌더 중(비동기).
  ready: 유효 PDF 로드 → 실행 버튼 활성.
  processing: 진행바(#prog) 진행, 재클릭 방지.
  success: 결과 파일 자동 다운로드 + ✅ 결과 문구(#result).
  error: ❌ 안전한 오류 문구(mdtlResult) → 전역 자동 캡처가 error 이벤트 전송.

components:
  dropzone: "#dz"
  pad: { id: "#pad", clear: "#clearPad" }
  preview: { id: "#pv", 쪽 이동: "#prevBtn/#nextBtn(#pageLabel)", 배치 마커: "#marker", 크기: "#sizeRange(#sizeVal)" }
  apply: "#applyBtn"
  rotated_warn: "#rotWarn (회전 쪽 경고)"

errors:
  no_signature: 서명 미작성 시 적용 불가.
  rotated_page: 회전된 쪽은 경고(#rotWarn) 노출.

telemetry:
  success: { tool: pdf-sign, outcome: success }

invariants:
  - 쪽수·쪽 크기 보존 + 서명 바이트가 실제 삽입됨(테스트 검증)
  - 외부 요청 0 — 파일은 브라우저를 떠나지 않는다
  - 텔레메트리에 파일명·내용 절대 미포함 (telemetry.spec.mjs)

tests:
  - tests/pdf-func.mjs  # 서명 삽입·보존 검증
