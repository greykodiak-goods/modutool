# pdf-watermark — 도구 계약 (실구현·테스트 역기입, 2026-08-22 소급)
id: pdf-watermark
purpose: 전 쪽에 텍스트 워터마크를 얹어 저장한다.
routes: [/pdf-watermark/, /ko/pdf-watermark/]
engine: pdf-lib

states:
  idle: 드롭존(#dz)만 표시. 실행 버튼 비활성.
  input_loading: 파일 파싱·미리보기 렌더 중(비동기).
  ready: 유효 PDF 로드 → 실행 버튼 활성.
  processing: 진행바(#prog) 진행, 재클릭 방지.
  success: 결과 파일 자동 다운로드 + ✅ 결과 문구(#result).
  error: ❌ 안전한 오류 문구(mdtlResult) → 전역 자동 캡처가 error 이벤트 전송.

components:
  text: "#wmText"
  opacity: "#wmOpacity(+표시 #wmOpacityVal)"
  scale: "#wmScale(+#wmScaleVal)"
  color: "#wmColor"
  position: "#wmPos"
  go: "#goBtn"

errors:
  empty_text: 텍스트 없으면 실행 불가/안내.

telemetry:
  success: { tool: pdf-watermark, outcome: success }

invariants:
  - 쪽수 보존 + 워터마크 삽입으로 바이트 증가(테스트 검증)
  - 외부 요청 0 — 파일은 브라우저를 떠나지 않는다
  - 텔레메트리에 파일명·내용 절대 미포함 (telemetry.spec.mjs)

tests:
  - tests/pdf-func.mjs  # 쪽수 보존·바이트 증가
