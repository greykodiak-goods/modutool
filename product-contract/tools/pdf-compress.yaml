# pdf-compress — 도구 계약 (실구현·테스트 역기입, 2026-08-22 소급)
id: pdf-compress
purpose: 이미지 재인코딩으로 PDF 용량을 줄인다. 더 작아지지 않으면 정직하게 내주지 않는다.
routes: [/pdf-compress/, /ko/pdf-compress/]
engine: pdf.js(렌더) + pdf-lib(재조립)

states:
  idle: 드롭존(#dz)만 표시. 실행 버튼 비활성.
  input_loading: 파일 파싱·미리보기 렌더 중(비동기).
  ready: 유효 PDF 로드 → 실행 버튼 활성.
  processing: 진행바(#prog) 진행, 재클릭 방지.
  success: 결과 파일 자동 다운로드 + ✅ 결과 문구(#result).
  error: ❌ 안전한 오류 문구(mdtlResult) → 전역 자동 캡처가 error 이벤트 전송.

components:
  dropzone: "#dz"
  level: { id: "#level", 압축 강도 선택 }
  compress: "#compBtn"
  file_info: "#fileInfo (원본 크기 표시)"

errors:
  result_not_smaller: 결과가 원본보다 크면 다운로드 없이 no_result 안내("왜 압축 안돼" 실제 문의에서 온 계약).

telemetry:
  success: { tool: pdf-compress, meta: [saved_pct 등] }
  no_result: { reason: result_not_smaller }

invariants:
  - 결과 ≥ 원본이면 파일을 내주지 않는다(무의미 결과 금지 — 테스트 검증)
  - 외부 요청 0 — 파일은 브라우저를 떠나지 않는다
  - 텔레메트리에 파일명·내용 절대 미포함 (telemetry.spec.mjs)

tests:
  - tests/pdf-func.mjs  # not-smaller 케이스 검증
