<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>백오피스 · 결과 통계 | ThisIsMyVideo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://greykodiak-goods.github.io/modutool/video/admin/">
<script>window.MDTL_SITE_BRAND="ThisIsMyVideo";window.MDTL_SITE_MARK="V";</script>
<script>window.MDTL_BASE='/modutool/video';</script>
<link rel="manifest" href="/modutool/video/manifest.webmanifest">
<link rel="stylesheet" href="/modutool/video/assets/site.css">
<script src="/modutool/video/assets/site.js"></script>
<script src="/modutool/video/assets/auth-config.js"></script>
<script src="/modutool/video/assets/auth.js"></script>
<style>
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:16px 0; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
  .kpi .n { font-size:26px; font-weight:800; line-height:1.1; }
  .kpi .l { font-size:12.5px; color:var(--text-soft); margin-top:4px; }
  .kpi.warn .n { color:var(--danger); }
  .sect { margin:26px 0 8px; font-size:16px; font-weight:700; }
  .sect small { font-weight:400; color:var(--text-soft); font-size:12.5px; margin-left:6px; }
  .tblwrap { overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); }
  table.bo { width:100%; border-collapse:collapse; font-size:13.5px; min-width:520px; }
  table.bo th, table.bo td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.bo th { background:var(--surface); font-weight:600; color:var(--text-soft); font-size:12px; text-transform:uppercase; letter-spacing:.02em; }
  table.bo tr:last-child td { border-bottom:0; }
  table.bo td.num, table.bo th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .bar { position:relative; height:8px; background:var(--line); border-radius:6px; overflow:hidden; min-width:80px; }
  .bar > span { position:absolute; left:0; top:0; bottom:0; background:var(--danger); border-radius:6px; }
  .tag { display:inline-block; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .tag.error { background:rgba(220,38,38,.12); color:var(--danger); }
  .tag.no_result { background:rgba(217,119,6,.14); color:var(--warn); }
  .tag.unsupported { background:rgba(100,116,139,.16); color:var(--text-soft); }
  .tag.cancelled { background:rgba(100,116,139,.16); color:var(--text-soft); }
  .tag.success { background:rgba(22,163,74,.14); color:var(--ok); }
  .daily { display:flex; align-items:flex-end; gap:3px; height:70px; padding:6px 2px 0; overflow-x:auto; }
  .daily .col { flex:0 0 auto; width:14px; display:flex; flex-direction:column; justify-content:flex-end; height:100%; }
  .daily .col i { display:block; width:100%; background:var(--accent-soft); border-radius:2px 2px 0 0; }
  .daily .col i.f { background:var(--danger); border-radius:0 0 2px 2px; }
  .rng { display:flex; gap:6px; flex-wrap:wrap; }
  .rng button { font-size:13px; padding:6px 12px; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:9px; cursor:pointer; }
  .rng button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .muted { color:var(--text-soft); font-size:13px; }
  code.meta { font-size:11.5px; color:var(--text-soft); }
</style>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main>
  <h1 class="page-title">백오피스 · 결과 통계</h1>
  <p class="page-sub">고객이 원하는 결과를 얻지 못한 순간(오류·미달성)을 익명 집계해 개선 우선순위를 잡습니다. 파일·개인정보는 저장하지 않고 도구·결과유형·사유·크기버킷 등 비식별 메타만 기록합니다.</p>

  <div class="rng" id="rng">
    <button data-d="7">최근 7일</button>
    <button data-d="30" class="on">30일</button>
    <button data-d="90">90일</button>
    <button data-d="365">1년</button>
  </div>

  <div id="loading" class="muted" style="margin:18px 0">불러오는 중…</div>
  <div id="denied" style="display:none" class="card"></div>
  <div id="dash" style="display:none"></div>
  <div id="inbox" style="display:none"></div>
</main>
<footer id="site-footer" class="site-footer"></footer>

<script>
(function () {
  var days = 30;
  var loading = document.getElementById('loading');
  var denied = document.getElementById('denied');
  var dash = document.getElementById('dash');

  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
  function n(x) { return (x == null ? 0 : x).toLocaleString('ko-KR'); }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }

  document.getElementById('rng').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    days = parseInt(b.dataset.d, 10) || 30;
    Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
    load();
  });

  async function load() {
    loading.style.display = ''; denied.style.display = 'none'; dash.style.display = 'none';
    loading.textContent = '불러오는 중…';
    var d;
    try {
      d = await window.mdtlCall('query', 'dashboard:dashboard', { days: days });
    } catch (e) {
      loading.style.display = 'none';
      denied.style.display = '';
      // 이 쿼리가 실패하는 사유는 사실상 "관리자 아님" 하나뿐이다(로그인 여부는 앞에서 확인).
      denied.innerHTML = '<div class="result show error" style="margin:0">🔒 ' +
        '이 계정은 관리자로 등록되어 있지 않습니다. 관리자 이메일로 로그인하거나, ' +
        'Supabase의 <code>tim_admin_users</code>에 이메일을 추가하세요.</div>';
      return;
    }
    render(d || {});
    fillControlBoard();
  }

  /* 관제 칸 실시간 채움 — 공개 리포의 GitHub API라 토큰 불필요. 실패해도 대시보드는 정상(폐쇄망 대비). */
  async function fillControlBoard() {
    function put(id, txt, color) { var el = document.getElementById(id); if (el) { el.textContent = txt; if (color) el.style.color = color; } }
    try {
      var res = await fetch('https://api.github.com/repos/greykodiak-goods/modutool/actions/runs?per_page=10');
      var runs = (await res.json()).workflow_runs || [];
      var ci = runs.filter(function (r) { return r.name === 'CI' && r.conclusion; })[0];        // 완료된 최신만
      var live = runs.filter(function (r) { return r.name === 'Live site check' && r.conclusion; })[0];
      var ok = ci && ci.conclusion === 'success' && (!live || live.conclusion === 'success');
      put('ctlRelease', ci ? (ok ? '정상' : '점검 필요') : '기록 없음', ok ? 'var(--ok)' : 'var(--danger)');
    } catch (e) { put('ctlRelease', '확인 불가'); }
    try {
      var c = await (await fetch('https://api.github.com/repos/greykodiak-goods/modutool/commits/main')).json();
      var msg = ((c.commit || {}).message || '').split('\n')[0];
      var when = new Date((((c.commit || {}).committer) || {}).date || 0);
      if (msg) {
        var h = Math.max(0, Math.round((Date.now() - when.getTime()) / 3600000));
        put('ctlImprove', h < 1 ? '방금' : h + '시간 전');
        document.getElementById('ctlImprove').title = msg;
      } else put('ctlImprove', '기록 없음');
    } catch (e) { put('ctlImprove', '확인 불가'); }
  }

  function render(d) {
    loading.style.display = 'none';
    dash.style.display = '';
    var total = d.total || 0, fail = d.fail_total || 0;
    var byOut = d.by_outcome || {};
    var tools = d.by_tool || [];
    var reasons = d.top_reasons || [];
    var daily = d.daily || [];
    var recent = d.recent || [];
    var viewsTotal = d.views_total || 0;
    var visitors = d.visitors_est || 0;
    var topPages = d.top_pages || [];
    var topRefs = d.top_refs || [];
    var viewsDaily = d.views_daily || [];

    var html = '';

    /* ── 관제 6칸 (대표 요구 2026-08-22: "열면 바로 보이는" 모니터링) ──
       출시·개선은 GitHub 공개 API로 실시간, 성과·유입·수요신호는 이 대시보드 데이터.
       폐쇄망·오프라인에선 GitHub 칸만 '확인 불가'로 남고 나머지는 정상 동작. */
    var waitlist = 0;
    (d.by_tool || []).forEach(function (t) { if (t.tool === 'waitlist-cta') waitlist = t.total; });
    html += '<div class="sect">관제 <small>출시·성과·유입·수익·개선·결정 — 6칸 요약</small></div>';
    html += '<div class="kpis" id="ctl">';
    html += '<div class="kpi"><div class="n" id="ctlRelease">…</div><div class="l">출시 상태 (CI·라이브 점검)</div></div>';
    html += '<div class="kpi"><div class="n">' + pct(total - fail, total) + '%</div><div class="l">작업 성공률 (' + n(total) + '건 중)</div></div>';
    html += '<div class="kpi"><div class="n">' + n(viewsTotal) + '</div><div class="l">유입 (페이지뷰 · 캠페인 ' + n((d.top_campaigns || []).length) + '종)</div></div>';
    html += '<div class="kpi"><div class="n">' + n(waitlist) + '</div><div class="l">수익 신호 (프리미엄 출시알림 클릭 — 결제 미개시)</div></div>';
    html += '<div class="kpi"><div class="n" id="ctlImprove">…</div><div class="l">최근 개선 (main 마지막 반영)</div></div>';
    html += '<div class="kpi warn"><div class="n">3</div><div class="l">대표 결정 대기 (도메인·Auth 이메일확인·AdSense)</div></div>';
    html += '</div>';

    // KPIs
    html += '<div class="kpis">';
    html += '<div class="kpi"><div class="n">' + n(viewsTotal) + '</div><div class="l">페이지뷰</div></div>';
    html += '<div class="kpi"><div class="n">' + n(visitors) + '</div><div class="l">방문 브라우저(추정)</div></div>';
    html += '<div class="kpi"><div class="n">' + n(total) + '</div><div class="l">도구 사용 이벤트</div></div>';
    html += '<div class="kpi warn"><div class="n">' + n(fail) + '</div><div class="l">미달성·오류</div></div>';
    html += '<div class="kpi"><div class="n">' + pct(fail, total) + '%</div><div class="l">실패율</div></div>';
    html += '</div>';

    // 트래픽: 일별 방문 + 인기 페이지 + 유입 출처
    html += '<div class="sect">일별 페이지뷰</div>';
    if (!viewsDaily.length) { html += '<p class="muted">데이터 없음 (pageview 수집은 이번 배포부터 시작)</p>'; }
    else {
      var vmax = viewsDaily.reduce(function (m, x) { return Math.max(m, x.views || 0); }, 1);
      html += '<div class="daily">';
      viewsDaily.forEach(function (x) {
        html += '<div class="col" title="' + esc(x.ymd) + ' · ' + n(x.views) + '뷰">' +
          '<i style="height:' + Math.max(2, Math.round((x.views / vmax) * 60)) + 'px"></i></div>';
      });
      html += '</div>';
    }
    if (topPages.length) {
      html += '<div class="sect">인기 페이지 <small>상위 30</small></div>';
      html += '<div class="tblwrap"><table class="bo"><thead><tr>' +
        '<th>페이지</th><th class="num">뷰</th><th class="num">세션</th><th class="num">ko</th><th class="num">en</th></tr></thead><tbody>';
      topPages.forEach(function (t) {
        html += '<tr><td><b>' + esc(t.page) + '</b></td><td class="num">' + n(t.views) + '</td>' +
          '<td class="num">' + n(t.sessions) + '</td><td class="num">' + n(t.ko) + '</td><td class="num">' + n(t.en) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    if (topRefs.length) {
      html += '<div class="sect">유입 출처 <small>리퍼러 도메인만 수집</small></div>';
      html += '<div class="tblwrap"><table class="bo"><thead><tr><th>출처</th><th class="num">뷰</th></tr></thead><tbody>';
      topRefs.forEach(function (r) {
        html += '<tr><td>' + esc(r.ref) + '</td><td class="num">' + n(r.c) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }

    /* 유입 귀속: 같은 sessionId의 첫 utm 유입 기준으로 캠페인→방문→실제 작업까지 연결.
       "어느 채널이 방문만 만들고, 어느 채널이 작업 성공을 만드나"의 답. */
    var campaigns = d.top_campaigns || [];
    if (campaigns.length) {
      html += '<div class="sect">캠페인 성과 <small>utm 유입 → 같은 세션의 작업 성공까지 연결</small></div>';
      html += '<div class="tblwrap"><table class="bo"><thead><tr>' +
        '<th>캠페인 (source / medium / campaign)</th><th class="num">뷰</th><th class="num">세션</th><th class="num">작업</th><th class="num">성공</th></tr></thead><tbody>';
      campaigns.forEach(function (c) {
        html += '<tr><td><b>' + esc(c.campaign) + '</b></td><td class="num">' + n(c.views) + '</td>' +
          '<td class="num">' + n(c.sessions) + '</td><td class="num">' + n(c.jobs) + '</td><td class="num">' + n(c.success) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }

    // outcome chips
    var chips = ['error', 'no_result', 'unsupported', 'cancelled', 'success'];
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px">';
    chips.forEach(function (k) {
      if (byOut[k]) html += '<span class="tag ' + k + '">' + k + ' · ' + n(byOut[k]) + '</span>';
    });
    html += '</div>';

    // by tool
    html += '<div class="sect">도구별 결과 <small>실패 많은 순</small></div>';
    if (!tools.length) { html += '<p class="muted">데이터 없음</p>'; }
    else {
      html += '<div class="tblwrap"><table class="bo"><thead><tr>' +
        '<th>도구</th><th class="num">전체</th><th class="num">성공</th><th class="num">실패</th><th class="num">실패율</th><th>비율</th>' +
        '</tr></thead><tbody>';
      tools.forEach(function (t) {
        var fr = pct(t.failed, t.total);
        html += '<tr><td><b>' + esc(t.tool) + '</b></td>' +
          '<td class="num">' + n(t.total) + '</td>' +
          '<td class="num">' + n(t.success) + '</td>' +
          '<td class="num">' + n(t.failed) + '</td>' +
          '<td class="num">' + fr + '%</td>' +
          '<td><div class="bar"><span style="width:' + fr + '%"></span></div></td></tr>';
      });
      html += '</tbody></table></div>';
    }

    // top reasons
    html += '<div class="sect">상위 미달성·오류 사유</div>';
    if (!reasons.length) { html += '<p class="muted">데이터 없음</p>'; }
    else {
      html += '<div class="tblwrap"><table class="bo"><thead><tr>' +
        '<th>도구</th><th>결과</th><th>사유</th><th class="num">건수</th></tr></thead><tbody>';
      reasons.forEach(function (r) {
        html += '<tr><td><b>' + esc(r.tool) + '</b></td>' +
          '<td><span class="tag ' + esc(r.outcome) + '">' + esc(r.outcome) + '</span></td>' +
          '<td>' + esc(r.reason) + '</td>' +
          '<td class="num">' + n(r.c) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }

    // daily trend
    html += '<div class="sect">일별 추이 <small>회색=전체, 빨강=실패</small></div>';
    if (!daily.length) { html += '<p class="muted">데이터 없음</p>'; }
    else {
      var max = daily.reduce(function (m, x) { return Math.max(m, x.total || 0); }, 1);
      html += '<div class="daily">';
      daily.forEach(function (x) {
        var okH = Math.round(((x.total - x.failed) / max) * 60);
        var fH = Math.round((x.failed / max) * 60);
        html += '<div class="col" title="' + esc(x.ymd) + ' · 전체 ' + n(x.total) + ' · 실패 ' + n(x.failed) + '">' +
          '<i class="f" style="height:' + fH + 'px"></i>' +
          '<i style="height:' + okH + 'px"></i></div>';
      });
      html += '</div>';
    }

    // recent failures feed
    html += '<div class="sect">최근 미달성·오류 <small>최신 50건</small></div>';
    if (!recent.length) { html += '<p class="muted">데이터 없음</p>'; }
    else {
      html += '<div class="tblwrap"><table class="bo"><thead><tr>' +
        '<th>시각(UTC)</th><th>도구</th><th>결과</th><th>사유</th><th>언어</th><th>메타</th></tr></thead><tbody>';
      recent.forEach(function (r) {
        var meta = '';
        try { meta = r.meta && Object.keys(r.meta).length ? JSON.stringify(r.meta) : ''; } catch (e) {}
        html += '<tr><td>' + esc(r.ts) + '</td>' +
          '<td><b>' + esc(r.tool) + '</b></td>' +
          '<td><span class="tag ' + esc(r.outcome) + '">' + esc(r.outcome) + '</span></td>' +
          '<td>' + esc(r.reason || '') + '</td>' +
          '<td>' + esc(r.lang || '') + '</td>' +
          '<td><code class="meta">' + esc(meta) + '</code></td></tr>';
      });
      html += '</tbody></table></div>';
    }

    if (d.sampled) {
      html += '<div class="result show" style="margin-top:22px">ℹ️ 이벤트가 많아 <b>사유·유입 출처·인기 페이지</b>는 최근 ' +
        n(d.scan_cap || 0) + '건 기준으로 계산했습니다. 총계·도구별·일별 수치는 전체 집계(롤업)라 정확합니다.</div>';
    }
    html += '<p class="muted" style="margin-top:22px">집계 시각: ' + esc((d.generated_at || '').replace('T', ' ').slice(0, 16)) +
      ' UTC · 기간 시작: ' + esc((d.since || '').replace('T', ' ').slice(0, 16)) + ' UTC</p>' +
      '<p class="muted">※ 초기 확인용 샘플(<code>meta.seed=true</code>) 몇 건이 포함되어 있을 수 있습니다.</p>';

    dash.innerHTML = html;
  }

  document.addEventListener('DOMContentLoaded', async function () {
    if (!(window.mdtlAuthClient && window.mdtlAuthClient())) {
      loading.textContent = '인증 모듈을 불러오지 못했습니다.';
      return;
    }
    await window.mdtlHandleOAuthReturn();
    if (!window.mdtlLoggedIn()) { location.href = (window.MDTL_BASE || '') + '/ko/login/'; return; }
    load();
    loadInbox();
  });

  /* ── 문의함 ──
     문의 폼을 만들어놓고 읽는 곳이 없으면 메시지가 쌓이기만 한다. 대시보드 아래에 붙인다.
     미처리 건이 있으면 먼저 보이도록 정렬하고, 처리 표시를 여기서 바로 할 수 있게 한다. */
  var inbox = document.getElementById('inbox');

  function fmtWhen(ms) {
    var d = new Date(ms);
    return d.toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
  }

  async function loadInbox() {
    var rows;
    try {
      rows = await window.mdtlCall('query', 'contact:list', {});
    } catch (e) {
      return;   // 관리자 아님 등 — 대시보드 쪽에서 이미 안내한다
    }
    inbox.style.display = '';
    var unread = rows.filter(function (r) { return !r.handled; }).length;
    var html = '<h2 style="margin-top:36px">문의함 ' +
      (unread ? '<span style="color:var(--accent-text)">· 미처리 ' + unread + '건</span>' : '<span class="muted">· 미처리 없음</span>') +
      '</h2>';
    if (!rows.length) {
      html += '<p class="muted">아직 받은 문의가 없습니다.</p>';
      inbox.innerHTML = html;
      return;
    }
    rows.sort(function (a, b) { return (a.handled - b.handled) || (b.at - a.at); });
    rows.forEach(function (r) {
      html += '<div class="card" style="margin-bottom:12px' + (r.handled ? ';opacity:.55' : '') + '">' +
        '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">' +
        '<b>' + esc(r.subject) + '</b>' +
        '<span class="muted">' + fmtWhen(r.at) + ' · ' + esc(r.lang || '?') + '/' + esc(r.site || '?') + '</span>' +
        '</div>' +
        '<p style="white-space:pre-wrap;margin:10px 0">' + esc(r.body) + '</p>' +
        (r.email
          ? '<p style="margin:0 0 10px"><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></p>'
          : '<p class="muted" style="margin:0 0 10px">회신 이메일 없음</p>') +
        '<button class="btn secondary" data-id="' + r.id + '" data-h="' + (r.handled ? '0' : '1') + '">' +
        (r.handled ? '미처리로 되돌리기' : '처리 완료로 표시') + '</button>' +
        '</div>';
    });
    inbox.innerHTML = html;
  }

  inbox.addEventListener('click', async function (e) {
    var b = e.target.closest('button[data-id]'); if (!b) return;
    b.disabled = true;
    try {
      await window.mdtlCall('mutation', 'contact:setHandled', { id: b.dataset.id, handled: b.dataset.h === '1' });
      await loadInbox();
    } catch (err) { b.disabled = false; }
  });
})();
</script>
</body>
</html>
