<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 계정 | ThisIsMyCalculator</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://greykodiak-goods.github.io/modutool/calc/ko/account/">
<link rel="alternate" hreflang="ko" href="https://greykodiak-goods.github.io/modutool/calc/ko/account/">
<link rel="alternate" hreflang="en" href="https://greykodiak-goods.github.io/modutool/calc/account/">
<link rel="alternate" hreflang="x-default" href="https://greykodiak-goods.github.io/modutool/calc/account/">
<script>window.MDTL_SITE_BRAND="ThisIsMyCalculator";window.MDTL_SITE_MARK="C";</script>
<script>window.MDTL_BASE='/modutool/calc';</script>
<link rel="manifest" href="/modutool/calc/manifest.webmanifest">
<link rel="stylesheet" href="/modutool/calc/assets/site.css">
<script src="/modutool/calc/assets/site.js"></script>
<script src="/modutool/calc/assets/auth-config.js"></script>
<script src="/modutool/calc/assets/auth.js"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main style="max-width:520px">
  <h1 class="page-title">내 계정</h1>
  <div class="card">
    <div id="loading">불러오는 중…</div>
    <div id="panel" style="display:none">
      <div class="calc-out">
        <div class="num" id="planLabel">무료</div>
        <div class="sub" id="emailLabel"></div>
        <div class="sub" id="planNote"></div>
      </div>
      <div class="btn-row">
        <a class="btn" id="upBtn" href="/modutool/calc/ko/pricing/">프리미엄 알아보기</a>
        <button class="btn secondary" id="logoutBtn">로그아웃</button>
        <button class="btn secondary" id="logoutAllBtn">모든 기기에서 로그아웃</button>
      </div>
      <p style="font-size:12.5px;color:var(--text-soft);margin:10px 0 0">이 기기에서는 로그인이 유지되며 세션이 자동 갱신됩니다. "모든 기기에서 로그아웃"은 어디서든 활성 세션을 전부 종료합니다.</p>
      <details style="margin-top:22px;border-top:1px solid var(--line);padding-top:16px">
        <summary style="cursor:pointer;font-size:14px;color:var(--text-soft)">회원 탈퇴(계정 삭제)</summary>
        <p style="font-size:13.5px;margin:10px 0">계정과 플랜 정보가 영구 삭제되며 되돌릴 수 없습니다. 확인을 위해 계정 이메일을 그대로 입력해 주세요.</p>
        <label class="field"><span>계정 이메일</span><input type="email" id="delEmail" autocomplete="off"></label>
        <button class="btn secondary" id="delBtn" style="margin-top:10px;border-color:#dc2626;color:#dc2626">계정 영구 삭제</button>
      </details>
    </div>
    <div class="result" id="msg"></div>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var loading = document.getElementById('loading');
  var msg = document.getElementById('msg');
  var BASE = window.MDTL_BASE || '';
  if (!(window.mdtlAuthClient && window.mdtlAuthClient())) {
    loading.textContent = '회원 기능은 오픈 준비 중입니다.';
    return;
  }

  await window.mdtlHandleOAuthReturn();
  if (!window.mdtlLoggedIn()) { location.href = BASE + '/ko/login/'; return; }

  var info;
  try {
    await window.mdtlCall('mutation', 'account:ensureProfile');
    info = await window.mdtlRefreshPlan();
  } catch (e) { info = null; }
  if (!info) { location.href = BASE + '/ko/login/'; return; }

  loading.style.display = 'none';
  document.getElementById('panel').style.display = '';
  document.getElementById('emailLabel').textContent = info.email;
  var premium = window.mdtlIsPremium();
  document.getElementById('planLabel').textContent = premium ? '프리미엄 \u2713' : '무료';
  document.getElementById('planNote').textContent = premium
    ? '광고 없이 이용 중입니다. 감사합니다!'
    : '프리미엄 결제 오픈 시 이 이메일로 알려드립니다 (사전등록 할인 대상).';
  if (premium) document.getElementById('upBtn').style.display = 'none';

  document.getElementById('logoutBtn').addEventListener('click', async function () {
    await window.mdtlSignOut();
    location.href = BASE + '/ko/';
  });

  document.getElementById('logoutAllBtn').addEventListener('click', async function () {
    msg.className = 'result';
    try { await window.mdtlCall('action', 'account:signOutEverywhere'); } catch (e) {}
    await window.mdtlSignOut();   // 이 기기의 토큰도 지운다
    location.href = BASE + '/ko/';
  });

  // 영구 삭제 — 되돌릴 수 없으므로 이메일 일치 + 확인 대화상자를 모두 통과해야 실행한다.
  document.getElementById('delBtn').addEventListener('click', async function () {
    msg.className = 'result';
    var typed = document.getElementById('delEmail').value.trim().toLowerCase();
    if (typed !== String(info.email).toLowerCase()) {
      mdtlResult(msg, '\u274c 계정 이메일과 일치하지 않습니다.', true);
      return;
    }
    if (!confirm('계정을 영구 삭제할까요? 되돌릴 수 없습니다.')) return;
    try {
      await window.mdtlCall('mutation', 'account:deleteAccount', { confirmEmail: typed });
      await window.mdtlSignOut();
      location.href = BASE + '/ko/';
    } catch (e) {
      mdtlResult(msg, '\u274c 계정을 삭제하지 못했습니다. 잠시 후 다시 시도해 주세요.', true);
    }
  });
});
</script>
</body>
</html>
