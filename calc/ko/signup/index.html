<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가입하기 | ThisIsMyCalculator</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://greykodiak-goods.github.io/modutool/calc/ko/signup/">
<link rel="alternate" hreflang="ko" href="https://greykodiak-goods.github.io/modutool/calc/ko/signup/">
<link rel="alternate" hreflang="en" href="https://greykodiak-goods.github.io/modutool/calc/signup/">
<link rel="alternate" hreflang="x-default" href="https://greykodiak-goods.github.io/modutool/calc/signup/">
<script>window.MDTL_SITE_BRAND="ThisIsMyCalculator";window.MDTL_SITE_MARK="C";</script>
<script>window.MDTL_BASE='/modutool/calc';</script>
<link rel="manifest" href="/modutool/calc/manifest.webmanifest">
<link rel="stylesheet" href="/modutool/calc/assets/site.css">
<script src="/modutool/calc/assets/site.js"></script>
<script src="/modutool/calc/assets/auth-config.js"></script>
<script src="/modutool/calc/assets/auth.js"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main style="max-width:440px">
  <h1 class="page-title">가입하기</h1>
  <p class="page-sub">가입하면 프리미엄 오픈 알림(사전등록 할인)을 받을 수 있습니다. 도구 사용에는 가입이 필요 없습니다.</p>
  <div class="card">
    <div id="notReady" style="display:none">
      <p>🛠️ 회원 기능은 오픈 준비 중입니다. 지금은 가입 없이 <a href="/modutool/calc/ko/">모든 도구</a>를 그대로 이용하세요.</p>
    </div>
    <form id="signupForm" class="calc-grid" style="display:none">
      <button class="btn-google" type="button" id="googleBtn"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Google로 계속하기</span></button>
      <p style="font-size:12px;color:var(--text-soft);margin:2px 0 6px">Google로 계속하면 <a href="/modutool/calc/ko/terms/">이용약관</a>과 <a href="/modutool/calc/ko/privacy/">개인정보처리방침</a>에 동의하는 것으로 간주됩니다.</p>
      <div class="auth-or">또는</div>
      <label class="field"><span>이메일</span><input type="email" id="email" required autocomplete="email"></label>
      <label class="field"><span>비밀번호 (8자 이상, 영문+숫자)</span><input type="password" id="password" required minlength="8" autocomplete="new-password"></label>
      <label style="font-size:13.5px;color:var(--text-soft);display:flex;gap:8px;align-items:flex-start">
        <input type="checkbox" id="agree" required style="margin-top:3px">
        <span><a href="/modutool/calc/ko/terms/">이용약관</a>과 <a href="/modutool/calc/ko/privacy/">개인정보처리방침</a>에 동의합니다.</span>
      </label>
      <button class="btn block" type="submit">가입하기</button>
      <div class="result" id="msg"></div>
      <p style="font-size:13.5px;color:var(--text-soft);margin:4px 0 0">이미 계정이 있나요? <a href="/modutool/calc/ko/login/">로그인</a></p>
    </form>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="/modutool/calc/assets/vendor/convex.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var msg = document.getElementById('msg');
  var form = document.getElementById('signupForm');
  if (!(window.mdtlAuthClient && window.mdtlAuthClient())) {
    document.getElementById('notReady').style.display = '';
    return;
  }
  var acct = (window.MDTL_BASE || '') + '/ko/account/';

  if (await window.mdtlHandleOAuthReturn()) { location.href = acct; return; }
  if (window.mdtlLoggedIn()) { location.href = acct; return; }

  form.style.display = '';
  document.getElementById('googleBtn').addEventListener('click', function () {
    msg.className = 'result';
    window.mdtlSignInWithGoogle('/ko/signup/').catch(function () {
      mdtlResult(msg, '\u274c 구글 가입은 아직 사용할 수 없습니다.', true);
    });
  });

  var PW_MSG = {
    short: '비밀번호는 8자 이상이어야 합니다.',
    long: '비밀번호는 128자 이하여야 합니다.',
    simple: '비밀번호에 영문과 숫자를 모두 포함해 주세요.'
  };

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    msg.className = 'result';
    var pw = document.getElementById('password').value;
    var problem = window.mdtlPasswordProblem(pw);
    if (problem) { mdtlResult(msg, '\u274c ' + PW_MSG[problem], true); return; }

    var btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      await window.mdtlSignInWithPassword(document.getElementById('email').value, pw, 'signUp');
      await window.mdtlCall('mutation', 'account:ensureProfile');
      await window.mdtlRefreshPlan();
      location.href = acct;
    } catch (err) {
      // 이미 가입된 이메일인지는 알려주지 않는다(계정 열거 방지).
      mdtlResult(msg, '\u274c 가입하지 못했습니다. 이미 가입하셨다면 <a href="/modutool/calc/ko/login/">로그인</a>해 주세요.', true);
      btn.disabled = false;
    }
  });
});
</script>
</body>
</html>
