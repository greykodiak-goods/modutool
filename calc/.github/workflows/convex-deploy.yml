# Convex 배포 — 개발 컨테이너는 네트워크 정책이 convex.dev를 차단하므로 러너(개방망)에서 배포한다.
# 사전조건: 레포 Settings → Secrets and variables → Actions → CONVEX_DEPLOY_KEY 등록.
name: Convex deploy
on:
  workflow_dispatch:
    inputs:
      seed_admin_email:
        description: "adminUsers에 시드할 관리자 이메일 (비우면 시드 생략)"
        required: false
        default: "greykodiak1@gmail.com"
      site_url:
        description: "OAuth 리다이렉트 허용 기준 URL (끝 슬래시 없이)"
        required: false
        default: "https://greykodiak-goods.github.io/modutool"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install --no-audit --no-fund
      # 시크릿 원본 = Doppler(awning-ops와 동일 패턴). 실패 시 GitHub Secret/Variable로 자동 폴백(무중단).
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
        continue-on-error: true

      - name: Resolve CONVEX_DEPLOY_KEY (Doppler → GitHub 폴백)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          KEY_FALLBACK: ${{ secrets.CONVEX_DEPLOY_KEY != '' && secrets.CONVEX_DEPLOY_KEY || vars.CONVEX_DEPLOY_KEY }}
        run: |
          KEY=""
          if [ -n "$DOPPLER_TOKEN" ] && command -v doppler >/dev/null 2>&1; then
            KEY=$(doppler secrets get CONVEX_DEPLOY_KEY --plain 2>/dev/null || true)
            [ -n "$KEY" ] && echo "✅ 시크릿 출처: Doppler"
          fi
          if [ -z "$KEY" ]; then
            KEY="$KEY_FALLBACK"
            [ -n "$KEY" ] && echo "⚠️ 시크릿 출처: GitHub Secret(폴백) — Doppler 조회 실패/미설정"
          fi
          if [ -z "$KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY를 Doppler·GitHub 어디서도 가져오지 못했습니다. (Doppler에 CONVEX_DEPLOY_KEY 등록 + 이 레포에 DOPPLER_TOKEN 시크릿 등록을 권장)"
            exit 1
          fi
          # 후속 스텝에 안전하게 전달(로그 마스킹 + env 파일)
          echo "::add-mask::$KEY"
          echo "CONVEX_DEPLOY_KEY=$KEY" >> "$GITHUB_ENV"
          echo "key resolved (${#KEY} chars)"
      # ── Convex Auth 서명키 (최초 1회 자동 생성) ──
      # @convex-dev/auth는 세션 JWT를 RS256으로 서명한다. 개인키(JWT_PRIVATE_KEY)와 공개 JWKS를
      # 배포 환경변수에 넣어야 하는데, 개발 컨테이너는 convex.dev가 막혀 있어 여기서 만든다.
      # ⚠️ 이미 값이 있으면 절대 덮어쓰지 않는다 — 키를 갈아끼우면 발급된 세션이 전부 무효가 된다.
      # 키는 로그에 찍지 않는다(길이만 출력).
      - name: Ensure Convex Auth signing keys
        run: |
          if npx convex env get JWT_PRIVATE_KEY >/dev/null 2>&1; then
            echo "JWT_PRIVATE_KEY 이미 설정됨 — 건너뜀(재생성 시 기존 세션 전부 무효화)"
          else
            echo "서명키 생성 중…"
            # jose는 ESM 전용이라 --input-type=module 로 실행한다.
            # 개인키는 표준출력이 아니라 파일로만 흘려보낸다(로그 노출 방지).
            node --input-type=module -e '
              import { generateKeyPair, exportPKCS8, exportJWK } from "jose";
              import { writeFileSync } from "node:fs";
              const keys = await generateKeyPair("RS256", { extractable: true });
              const pkcs8 = await exportPKCS8(keys.privateKey);
              const pub = await exportJWK(keys.publicKey);
              // Convex 환경변수는 개행을 담기 어려워 공백으로 치환한다(@convex-dev/auth 관례).
              writeFileSync("/tmp/jwt_private_key", pkcs8.trimEnd().replace(/\n/g, " "));
              writeFileSync("/tmp/jwks", JSON.stringify({ keys: [{ use: "sig", ...pub }] }));
            '
            npx convex env set JWT_PRIVATE_KEY -- "$(cat /tmp/jwt_private_key)"
            npx convex env set JWKS -- "$(cat /tmp/jwks)"
            rm -f /tmp/jwt_private_key /tmp/jwks
            echo "서명키 설정 완료"
          fi
          # OAuth 리다이렉트 허용 기준. 이 값으로 시작하는 redirectTo만 통과한다.
          npx convex env set SITE_URL -- "${SITE_URL_INPUT:-https://greykodiak-goods.github.io/modutool}"
        env:
          SITE_URL_INPUT: ${{ inputs.site_url }}

      - name: Deploy schema + functions
        run: npx convex deploy --yes
      - name: Seed admin email
        if: inputs.seed_admin_email != ''
        run: npx convex run admin:seedAdmin '{"email":"${{ inputs.seed_admin_email }}"}'
      - name: E2E — /log-event HTTP action
        run: |
          # deploy key 형식 dev:<name>|... 에서 deployment 이름 추출 → .convex.site URL
          NAME=$(echo "$CONVEX_DEPLOY_KEY" | sed -E 's/^[a-z]+:([^|]+)\|.*/\1/')
          SITE="https://$NAME.convex.site"
          echo "endpoint: $SITE/log-event"
          fail=0
          echo "--- valid insert (expect 201) ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SITE/log-event" \
            -H "Content-Type: application/json" -H "Origin: https://greykodiak-goods.github.io" \
            --data '{"tool":"convex-ci","outcome":"error","reason":"ci_e2e","lang":"en","site":"pdf","ua":"ci/runner","meta":{"seed":true}}')
          echo "insert: $code"; [ "$code" = "201" ] || fail=1
          echo "--- bad json (expect 400) ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SITE/log-event" \
            -H "Content-Type: application/json" --data 'not-json')
          echo "bad json: $code"; [ "$code" = "400" ] || fail=1
          echo "--- CORS preflight (expect 204 + allow-origin) ---"
          hdr=$(curl -s -D - -o /dev/null -X OPTIONS "$SITE/log-event" \
            -H "Origin: https://greykodiak-goods.github.io" -H "Access-Control-Request-Method: POST")
          echo "$hdr" | head -8
          echo "$hdr" | grep -qi "access-control-allow-origin" || fail=1
          echo "--- Convex Auth 라우트 존재 (404가 아니어야 함) ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/.well-known/openid-configuration")
          echo "openid-configuration: $code"; [ "$code" = "200" ] || fail=1
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/.well-known/jwks.json")
          echo "jwks.json: $code"; [ "$code" = "200" ] || fail=1
          exit $fail
