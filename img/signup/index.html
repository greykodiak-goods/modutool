<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | ThisIsMyIMG</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://greykodiak-goods.github.io/modutool/img/signup/">
<link rel="alternate" hreflang="ko" href="https://greykodiak-goods.github.io/modutool/img/ko/signup/">
<link rel="alternate" hreflang="en" href="https://greykodiak-goods.github.io/modutool/img/signup/">
<link rel="alternate" hreflang="x-default" href="https://greykodiak-goods.github.io/modutool/img/signup/">
<script>window.MDTL_SITE_BRAND="ThisIsMyIMG";window.MDTL_SITE_MARK="I";</script>
<script>window.MDTL_BASE='/modutool/img';</script>
<link rel="manifest" href="/modutool/img/manifest.webmanifest">
<link rel="stylesheet" href="/modutool/img/assets/site.css">
<script src="/modutool/img/assets/site.js"></script>
<script src="/modutool/img/assets/auth-config.js"></script>
<script src="/modutool/img/assets/auth.js"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main style="max-width:440px">
  <h1 class="page-title">Sign up</h1>
  <p class="page-sub">Sign up for the Premium launch alert (with an early discount). No account is needed to use the tools.</p>
  <div class="card">
    <div id="notReady" style="display:none">
      <p>🛠️ Accounts are launching soon. Meanwhile, use <a href="/modutool/img/">every tool</a> without signing up.</p>
    </div>
    <form id="signupForm" class="calc-grid" style="display:none">
      <button class="btn-google" type="button" id="googleBtn"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Continue with Google</span></button>
      <p style="font-size:12px;color:var(--text-soft);margin:2px 0 6px">By continuing with Google you agree to our <a href="/modutool/img/terms/">Terms</a> and <a href="/modutool/img/privacy/">Privacy Policy</a>.</p>
      <div class="auth-or">or</div>
      <label class="field"><span>Email</span><input type="email" id="email" required autocomplete="email"></label>
      <label class="field"><span>Password (8+ characters, letters and numbers)</span><input type="password" id="password" required minlength="8" autocomplete="new-password"></label>
      <label style="font-size:13.5px;color:var(--text-soft);display:flex;gap:8px;align-items:flex-start">
        <input type="checkbox" id="agree" required style="margin-top:3px">
        <span>I agree to the <a href="/modutool/img/terms/">Terms</a> and <a href="/modutool/img/privacy/">Privacy Policy</a>.</span>
      </label>
      <button class="btn block" type="submit">Create account</button>
      <div class="result" id="msg"></div>
      <p style="font-size:13.5px;color:var(--text-soft);margin:4px 0 0">Already have an account? <a href="/modutool/img/login/">Log in</a></p>
    </form>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="/modutool/img/assets/vendor/convex.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var msg = document.getElementById('msg');
  var form = document.getElementById('signupForm');
  if (!(window.mdtlAuthClient && window.mdtlAuthClient())) {
    document.getElementById('notReady').style.display = '';
    return;
  }
  var acct = (window.MDTL_BASE || '') + '/account/';

  if (await window.mdtlHandleOAuthReturn()) { location.href = acct; return; }
  if (window.mdtlLoggedIn()) { location.href = acct; return; }

  form.style.display = '';
  document.getElementById('googleBtn').addEventListener('click', function () {
    msg.className = 'result';
    window.mdtlSignInWithGoogle('/signup/').catch(function () {
      mdtlResult(msg, '❌ Google sign-in is not available yet.', true);
    });
  });

  var PW_MSG = {
    short: 'Password must be at least 8 characters.',
    long: 'Password must be 128 characters or fewer.',
    simple: 'Password must contain both letters and numbers.'
  };

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    msg.className = 'result';
    var pw = document.getElementById('password').value;
    var problem = window.mdtlPasswordProblem(pw);
    if (problem) { mdtlResult(msg, '❌ ' + PW_MSG[problem], true); return; }

    var btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      await window.mdtlSignInWithPassword(document.getElementById('email').value, pw, 'signUp');
      await window.mdtlCall('mutation', 'account:ensureProfile');
      await window.mdtlRefreshPlan();
      location.href = acct;
    } catch (err) {
      // 이미 가입된 이메일인지 여부는 서버가 알려주지 않는다(계정 열거 방지).
      mdtlResult(msg, '❌ Could not create the account. If you already signed up, <a href="/modutool/img/login/">log in</a> instead.', true);
      btn.disabled = false;
    }
  });
});
</script>
</body>
</html>
